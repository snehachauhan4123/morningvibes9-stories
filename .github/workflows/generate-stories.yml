name: Auto-Generate & Publish Web Stories

on:
  schedule:
    # Runs automatically every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual 1-click trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Web Stories Auto-Generator
        run: python scripts/generate_stories.py

      - name: Commit and Push New Stories
        run: |
          git config --global user.name "MorningVibes9 Bot"
          git config --global user.email "bot@morningvibes9.com"
          git add stories/ index.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-published latest Web Stories" && git push)
